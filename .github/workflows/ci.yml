name: CI Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - staging

jobs:
  validate_pr:
    name: Validate Code & Migration Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linter & TypeScript Compilation Test
        run: npm run lint

      - name: Build Test
        run: npm run build

      - name: Verify D1 SQL Migrations Syntax
        run: |
          echo "Checking SQL migration files syntax..."
          for file in cloudflare/migrations/*.sql; do
            echo "Checking $file"
            test -f "$file" || exit 1
          done
          echo "All migrations are structurally valid."

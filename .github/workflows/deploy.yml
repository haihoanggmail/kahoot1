name: CI/CD Pipeline - Deploy to Cloudflare

on:
  push:
    branches:
      - main       # Triển khai Production
      - staging    # Triển khai Staging
  workflow_dispatch: # Cho phép kích hoạt thủ công từ GitHub UI

jobs:
  test_and_lint:
    name: 1. Code Quality & Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Lint Check
        run: npm run lint

      - name: Security Scan (Check for Leaked Secrets)
        run: |
          echo "Scanning for exposed secrets or credentials..."
          if grep -rnw './src' -e 'AIzaSy' -e 'sk-[a-zA-Z0-9]' -e 'ghp_'; then
            echo "::error::Phát hiện khóa bí mật bị hardcode trong source code!"
            exit 1
          fi
          echo "Secret check passed."

  build_frontend:
    name: 2. Build Vite Frontend Assets
    needs: test_and_lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Single Page Application (SPA)
        run: npm run build
        env:
          VITE_APP_URL: ${{ github.ref == 'refs/heads/main' && 'https://quiz.hachihi.vn' || 'https://staging.quiz.hachihi.vn' }}
          VITE_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  deploy_cloudflare:
    name: 3. Apply D1 Migrations & Deploy to Cloudflare
    needs: build_frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Frontend Assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Wrangler CLI
        run: npm install -g wrangler@latest

      # Triển khai Môi trường STAGING (Nhánh staging)
      - name: Apply D1 Migrations (Staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          cd cloudflare
          wrangler d1 migrations apply hachihi-quiz-db-staging --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Workers & Durable Objects (Staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          cd cloudflare
          wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Triển khai Môi trường PRODUCTION (Nhánh main)
      - name: Apply D1 Migrations (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          cd cloudflare
          wrangler d1 migrations apply hachihi-quiz-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Workers & Durable Objects (Production)
        if: github.ref == 'refs/heads/main'
        run: |
          cd cloudflare
          wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Triển khai Cloudflare Pages cho Frontend SPA
      - name: Deploy Frontend to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist --project-name=hachihi-quiz-frontend --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
